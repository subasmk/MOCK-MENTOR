<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="bgM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d2254"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <radialGradient id="skinM" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5cba7"/>
      <stop offset="100%" stop-color="#d4956a"/>
    </radialGradient>
    <linearGradient id="shirtM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0d1b38"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bgM)"/>

  <!-- Shirt / torso -->
  <path d="M20 120 Q20 88 60 88 Q100 88 100 120Z" fill="url(#shirtM)"/>
  <!-- Collar -->
  <path d="M48 88 L60 100 L72 88" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="53" y="74" width="14" height="16" rx="4" fill="url(#skinM)"/>

  <!-- Head -->
  <ellipse cx="60" cy="54" rx="22" ry="24" fill="url(#skinM)"/>

  <!-- Hair (short, dark) -->
  <path d="M38 50 Q38 28 60 28 Q82 28 82 50 L80 44 Q76 32 60 32 Q44 32 40 44Z" fill="#2c1a0e"/>

  <!-- Ears -->
  <ellipse cx="37" cy="54" rx="4" ry="5" fill="#d4956a"/>
  <ellipse cx="83" cy="54" rx="4" ry="5" fill="#d4956a"/>

  <!-- Eyes -->
  <ellipse cx="52" cy="52" rx="4" ry="4.5" fill="#fff"/>
  <ellipse cx="68" cy="52" rx="4" ry="4.5" fill="#fff"/>
  <circle cx="53" cy="52" r="2.5" fill="#3a2010"/>
  <circle cx="69" cy="52" r="2.5" fill="#3a2010"/>
  <!-- Eye glints -->
  <circle cx="54" cy="50.5" r="0.9" fill="#fff"/>
  <circle cx="70" cy="50.5" r="0.9" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M47 46.5 Q52 44.5 57 46.5" stroke="#2c1a0e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M63 46.5 Q68 44.5 73 46.5" stroke="#2c1a0e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M60 55 Q58 61 56 62 Q60 64 64 62 Q62 61 60 55Z" fill="#c4855a" opacity="0.6"/>

  <!-- Mouth (neutral professional) -->
  <path d="M53 68 Q60 72 67 68" stroke="#a0694a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Subtle chin shadow -->
  <ellipse cx="60" cy="75" rx="10" ry="3" fill="#c4855a" opacity="0.25"/>

  <!-- Cyan glow accent ring -->
  <circle cx="60" cy="60" r="58" stroke="#00e5ff" stroke-width="0.6" opacity="0.25"/>
</svg>
