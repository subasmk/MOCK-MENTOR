<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="bgF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0d38"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <radialGradient id="skinF" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fddbb4"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </radialGradient>
    <linearGradient id="blouseF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b1d8a"/>
      <stop offset="100%" stop-color="#2a0d50"/>
    </linearGradient>
    <radialGradient id="hairF" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4a2060"/>
      <stop offset="100%" stop-color="#1a0830"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bgF)"/>

  <!-- Blouse / torso -->
  <path d="M18 120 Q22 84 60 84 Q98 84 102 120Z" fill="url(#blouseF)"/>

  <!-- Hair (long, falls behind shoulders) -->
  <path d="M30 56 Q26 90 34 108 Q44 96 44 78" fill="url(#hairF)"/>
  <path d="M90 56 Q94 90 86 108 Q76 96 76 78" fill="url(#hairF)"/>

  <!-- Neck -->
  <rect x="53" y="72" width="14" height="14" rx="4" fill="url(#skinF)"/>

  <!-- Head -->
  <ellipse cx="60" cy="52" rx="22" ry="24" fill="url(#skinF)"/>

  <!-- Hair top -->
  <path d="M37 50 Q36 24 60 24 Q84 24 83 50 L81 42 Q78 28 60 28 Q42 28 39 42Z" fill="url(#hairF)"/>

  <!-- Ears -->
  <ellipse cx="37" cy="53" rx="4" ry="5" fill="#e8a87c"/>
  <ellipse cx="83" cy="53" rx="4" ry="5" fill="#e8a87c"/>
  <!-- Earrings -->
  <circle cx="37" cy="59" r="2.5" fill="#7c3aed" opacity="0.9"/>
  <circle cx="83" cy="59" r="2.5" fill="#7c3aed" opacity="0.9"/>

  <!-- Eyes -->
  <ellipse cx="51" cy="50" rx="4.5" ry="4" fill="#fff"/>
  <ellipse cx="69" cy="50" rx="4.5" ry="4" fill="#fff"/>
  <circle cx="51.5" cy="50" r="2.8" fill="#2a1050"/>
  <circle cx="69.5" cy="50" r="2.8" fill="#2a1050"/>
  <!-- Eye glints -->
  <circle cx="52.5" cy="48.5" r="1" fill="#fff"/>
  <circle cx="70.5" cy="48.5" r="1" fill="#fff"/>
  <!-- Lashes -->
  <path d="M46 46.5 L47.5 44" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M49 45.5 L50 43" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M52 45 L52.5 42.5" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M64 45 L63.5 42.5" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M67 45.5 L67 43" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M70 46.5 L71.5 44" stroke="#1a0830" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Eyebrows (arched) -->
  <path d="M45 44 Q51 41 57 43.5" stroke="#3a1860" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M63 43.5 Q69 41 75 44" stroke="#3a1860" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M60 54 Q58 59 56 60 Q60 62 64 60 Q62 59 60 54Z" fill="#d4946a" opacity="0.55"/>

  <!-- Lips -->
  <path d="M53 66 Q57 64.5 60 65.5 Q63 64.5 67 66" stroke="#c0546a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M53 66 Q60 69.5 67 66" stroke="#c0546a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Violet glow accent ring -->
  <circle cx="60" cy="60" r="58" stroke="#7c3aed" stroke-width="0.6" opacity="0.3"/>
</svg>
