<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a2e"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <linearGradient id="bodyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#0a1828"/>
    </linearGradient>
    <linearGradient id="headR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3d6e"/>
      <stop offset="100%" stop-color="#0e2040"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="url(#bgR)"/>

  <!-- Circuit traces (decorative background) -->
  <path d="M10 60 H35 M85 60 H110" stroke="#00e5ff" stroke-width="0.5" opacity="0.2"/>
  <path d="M60 10 V30 M60 90 V110" stroke="#00e5ff" stroke-width="0.5" opacity="0.2"/>
  <circle cx="35" cy="60" r="2" fill="#00e5ff" opacity="0.2"/>
  <circle cx="85" cy="60" r="2" fill="#00e5ff" opacity="0.2"/>

  <!-- Body / torso -->
  <path d="M25 120 L25 90 Q25 84 32 84 L88 84 Q95 84 95 90 L95 120Z" fill="url(#bodyR)"/>
  <!-- Chest panel -->
  <rect x="40" y="90" width="40" height="20" rx="4" fill="#0d1b38" stroke="#00e5ff" stroke-width="0.8" opacity="0.8"/>
  <!-- Chest LEDs -->
  <circle cx="50" cy="100" r="3" fill="#00e5ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="60" cy="100" r="3" fill="#7c3aed" filter="url(#glow)" opacity="0.9"/>
  <circle cx="70" cy="100" r="3" fill="#00e5ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Neck / connector -->
  <rect x="52" y="76" width="16" height="10" rx="3" fill="url(#bodyR)" stroke="#1a3050" stroke-width="1"/>
  <line x1="56" y1="78" x2="56" y2="84" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="78" x2="60" y2="84" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="78" x2="64" y2="84" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>

  <!-- Head shell -->
  <rect x="28" y="22" width="64" height="56" rx="14" fill="url(#headR)" stroke="#1e4080" stroke-width="1.2"/>
  <!-- Head highlight -->
  <path d="M36 30 Q60 26 84 30" stroke="#2a5090" stroke-width="1" opacity="0.6" fill="none"/>

  <!-- Antenna -->
  <line x1="60" y1="22" x2="60" y2="10" stroke="#1a3a6b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="4" fill="#00e5ff" filter="url(#glow)" opacity="0.95"/>
  <!-- Antenna ring -->
  <circle cx="60" cy="8" r="6.5" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Ear / side panels -->
  <rect x="22" y="40" width="8" height="20" rx="3" fill="#0e2040" stroke="#1a3a6b" stroke-width="1"/>
  <rect x="90" y="40" width="8" height="20" rx="3" fill="#0e2040" stroke="#1a3a6b" stroke-width="1"/>
  <!-- Side LED -->
  <circle cx="26" cy="50" r="2" fill="#00e5ff" opacity="0.6"/>
  <circle cx="94" cy="50" r="2" fill="#00e5ff" opacity="0.6"/>

  <!-- Visor band (dark tinted) -->
  <rect x="32" y="38" width="56" height="22" rx="8" fill="#040c1a" stroke="#00e5ff" stroke-width="0.8" opacity="0.9"/>
  <!-- Visor inner glow -->
  <rect x="34" y="40" width="52" height="18" rx="7" fill="#061428" opacity="0.6"/>

  <!-- Eyes — glowing HUD circles -->
  <circle cx="48" cy="49" r="7.5" fill="#040c1a" stroke="#00e5ff" stroke-width="1.2"/>
  <circle cx="72" cy="49" r="7.5" fill="#040c1a" stroke="#00e5ff" stroke-width="1.2"/>
  <!-- Iris -->
  <circle cx="48" cy="49" r="4.5" fill="#00e5ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="72" cy="49" r="4.5" fill="#00e5ff" opacity="0.15" filter="url(#glow)"/>
  <!-- Pupil cross-hair -->
  <line x1="44" y1="49" x2="52" y2="49" stroke="#00e5ff" stroke-width="0.7" opacity="0.8"/>
  <line x1="48" y1="45" x2="48" y2="53" stroke="#00e5ff" stroke-width="0.7" opacity="0.8"/>
  <line x1="68" y1="49" x2="76" y2="49" stroke="#00e5ff" stroke-width="0.7" opacity="0.8"/>
  <line x1="72" y1="45" x2="72" y2="53" stroke="#00e5ff" stroke-width="0.7" opacity="0.8"/>
  <!-- Eye bright center -->
  <circle cx="48" cy="49" r="2" fill="#00e5ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="72" cy="49" r="2" fill="#00e5ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Mouth / speaker grille -->
  <rect x="40" y="67" width="40" height="8" rx="4" fill="#040c1a" stroke="#1a3a6b" stroke-width="0.8"/>
  <line x1="46" y1="71" x2="48" y2="71" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="51" y1="71" x2="57" y2="71" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="71" x2="66" y2="71" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="69" y1="71" x2="74" y2="71" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="58" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>
</svg>
